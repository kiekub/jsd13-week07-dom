<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pokédex</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Pokédex</h1>
    <p>Explore Pokémon</p>
  </header>


  <!-- Controls -->
  <section class="controls">

    <input
      type="text"
      id="search-input"
      placeholder="Search Pokémon"
    >

    <button id="search-btn">
      Search
    </button>

    <button id="random-btn">
      Random
    </button>

    <button id="reset-btn">
      Reset
    </button>

  </section>


  <!-- Pokémon cards -->
  <main id="pokedex" class="pokedex">
  </main>


  <script src="script.js"></script>

</body>
</html>
